name: Terraform CI/CD

# Trigger manual para rodar a pipeline
on:
  workflow_dispatch: 
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read

jobs:
  job1:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # realiza o clone do repositório pra máquina virtual (runner) que irá rodar o Terraform
        uses: actions/checkout@v5.0.0

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.3.0        
        with:
          role-to-assume: arn:aws:iam::767407960332:role/GitHubInfraRole
          aws-region: us-east-2

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform Validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        if: github.event.input.apply == 'true'