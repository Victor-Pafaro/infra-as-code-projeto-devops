name: Terraform CI/CD

on:
  workflow_dispatch: 
    inputs:
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read

jobs:
  job1:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          echo "ID Token URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Claims do Token:"
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$TOKEN"

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4        
        with:
          role-to-assume: arn:aws:iam::767407960332:role/GitHubInfraRole
          aws-region: us-east-2

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        if: github.event.inputs.apply == 'true'